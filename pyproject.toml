[project]
name = "movie-recommendation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "himanshukr72", email = "himanshukr72830@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gdown>=6.4.2",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "torch>=2.14.1",
]

[project.scripts]
movie-recommendation = "movie_recommendation:main"

[build-system]
